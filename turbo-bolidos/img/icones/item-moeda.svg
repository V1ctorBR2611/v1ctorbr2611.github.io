<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="ciSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f29a12"/><stop offset="0.5" stop-color="#c25a06"/><stop offset="1" stop-color="#7a2c04"/>
    </linearGradient>
    <linearGradient id="ciRim" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#fffce6"/><stop offset="0.22" stop-color="#ffe873"/>
      <stop offset="0.5" stop-color="#ffc21a"/><stop offset="0.8" stop-color="#f2870a"/><stop offset="1" stop-color="#c94605"/>
    </linearGradient>
    <linearGradient id="ciField" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff29a"/><stop offset="0.45" stop-color="#ffd21e"/><stop offset="1" stop-color="#ee9a08"/>
    </linearGradient>
  </defs>
  <g transform="rotate(10 32 32)">
    <!-- the edge: the face's outline repeated to the right, joined by a band -->
    <path d="M30 6h6a20 26 0 0 1 0 52h-6Z" fill="url(#ciSide)"/>
    <ellipse cx="36" cy="32" rx="20" ry="26" fill="url(#ciSide)"/>
    <path d="M52.5 18a20 26 0 0 1 0 28" stroke="#ffcf5a" stroke-width="1.4" stroke-opacity="0.6"/>
    <!-- the face -->
    <ellipse cx="30" cy="32" rx="20" ry="26" fill="url(#ciRim)"/>
    <ellipse cx="30" cy="32" rx="15.4" ry="20.4" stroke="#d0590a" stroke-width="1.3"/>
    <ellipse cx="30" cy="32" rx="14.6" ry="19.6" fill="url(#ciField)"/>
    <path d="M12.4 22a20 26 0 0 1 10.6-13.4" stroke="#fffdf2" stroke-width="2.6"/>
    <path d="M13 44a20 26 0 0 0 8 10" stroke="#ffe873" stroke-width="1.8" stroke-opacity="0.5"/>
    <!-- the bolt, raised: two shadows down-right, a lit edge up-left -->
    <g transform="translate(30 32) scale(0.95 1.25) translate(-24 -24)">
      <path d="M29.2 10.6 16.6 26.2 23.6 27.2 18.8 37.4 31.4 21.6 24.4 20.6Z" fill="#b45c05" fill-opacity="0.45" transform="translate(1.8 1.6)"/>
      <path d="M29.2 10.6 16.6 26.2 23.6 27.2 18.8 37.4 31.4 21.6 24.4 20.6Z" fill="#b85f05" transform="translate(0.85 0.8)"/>
      <path d="M29.2 10.6 16.6 26.2 23.6 27.2 18.8 37.4 31.4 21.6 24.4 20.6Z" fill="#fff3a6" transform="translate(-0.7 -0.6)"/>
      <path d="M29.2 10.6 16.6 26.2 23.6 27.2 18.8 37.4 31.4 21.6 24.4 20.6Z" fill="#ffdc3a"/>
    </g>
  </g></svg>