<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <radialGradient id="bmBody" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#6a7088"/><stop offset="0.22" stop-color="#2c3040"/>
      <stop offset="0.7" stop-color="#14161e"/><stop offset="1" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="bmBand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#16299a"/><stop offset="0.3" stop-color="#3f6bff"/>
  <stop offset="0.45" stop-color="#8fb0ff"/><stop offset="0.75" stop-color="#2a4de0"/>
  <stop offset="1" stop-color="#101e78"/></linearGradient>
    <linearGradient id="bmGold" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#a8580a"/><stop offset="0.3" stop-color="#ffc53a"/>
  <stop offset="0.45" stop-color="#fff0a8"/><stop offset="0.75" stop-color="#e89a14"/>
  <stop offset="1" stop-color="#94480a"/></linearGradient>
    <radialGradient id="bmSpark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/><stop offset="0.45" stop-color="#ffd23a"/><stop offset="1" stop-color="#ff7a10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="31" cy="38" r="22" fill="url(#bmBody)"/>
  <!-- the band: a strip following the ball's equator, seen from a little above -->
  <path d="M9.4 34.5a22 7 0 0 0 43.2 0v7.4a22 7.6 0 0 1-43.2 0Z" fill="url(#bmBand)"/>
  <path d="M9.4 34.5a22 7 0 0 0 43.2 0" stroke="#a9c2ff" stroke-width="1" stroke-opacity="0.7"/>
  <g fill="#0e1a66" fill-opacity="0.7">
    <rect x="15" y="39.4" width="3.2" height="4.4" rx="0.8"/><rect x="23" y="41.4" width="3.2" height="4.4" rx="0.8"/>
    <rect x="31.4" y="41.8" width="3.2" height="4.4" rx="0.8"/><rect x="39.8" y="41" width="3.2" height="4.4" rx="0.8"/>
    <rect x="47" y="38.6" width="3" height="4.2" rx="0.8"/>
  </g>
  <!-- the yellow mark under the band -->
  <path d="M30 50.4h5.2l-2.6 3.8Z" fill="#ffc21a"/>
  <!-- a cool rim on the shadow side, so the ball separates from a dark slot -->
  <path d="M51.6 46a22 22 0 0 1-13.2 13" stroke="#7d8cc8" stroke-width="1.6" stroke-opacity="0.55"/>
  <!-- speculars -->
  <ellipse cx="22" cy="24.5" rx="6.4" ry="3.6" fill="#ffffff" fill-opacity="0.22" transform="rotate(-30 22 24.5)"/>
  <circle cx="19.4" cy="26.4" r="1.6" fill="#ffffff" fill-opacity="0.75"/>
  <!-- collar -->
  <path d="M23 16.4v4.6a8 2.8 0 0 0 16 0v-4.6Z" fill="url(#bmBand)"/>
  <ellipse cx="31" cy="16.4" rx="8" ry="2.8" fill="#6f92ff"/>
  <ellipse cx="31" cy="16.6" rx="4.6" ry="1.5" fill="#1a2a8a"/>
  <!-- the fuse: a twisted cord leaning right -->
  <path d="M31 16.4c-.6-3 1.6-4.6 1-7.2s1.8-4.2 3.4-5.6" stroke="url(#bmGold)" stroke-width="3.6"/>
  <path d="M30.2 13.6l2.6-1.2M31.6 9.6l2.4-1.2M33.4 6.2l2-1.2" stroke="#a8580a" stroke-width="1.1"/>
  <circle cx="36.4" cy="3.6" r="4" fill="url(#bmSpark)"/>
  <circle cx="36.4" cy="3.6" r="1.3" fill="#fffbe0"/></svg>