<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="ntCap" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#6a1580"/><stop offset="0.3" stop-color="#d43fd0"/>
  <stop offset="0.45" stop-color="#ff8ff2"/><stop offset="0.75" stop-color="#b52cba"/>
  <stop offset="1" stop-color="#5a0f6c"/></linearGradient>
    <linearGradient id="ntGold" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#a8580a"/><stop offset="0.3" stop-color="#ffc53a"/>
  <stop offset="0.45" stop-color="#fff0a8"/><stop offset="0.75" stop-color="#e89a14"/>
  <stop offset="1" stop-color="#94480a"/></linearGradient>
    <linearGradient id="ntJuice" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#0a2a72"/><stop offset="0.3" stop-color="#2f7ff0"/>
  <stop offset="0.45" stop-color="#a6dcff"/><stop offset="0.75" stop-color="#2566d6"/>
  <stop offset="1" stop-color="#08215a"/></linearGradient>
    <linearGradient id="ntTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3f6"/><stop offset="1" stop-color="#c437c4"/>
    </linearGradient>
    <linearGradient id="ntPin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c47812"/><stop offset="0.4" stop-color="#ffe27a"/><stop offset="1" stop-color="#b8650c"/>
    </linearGradient>
  </defs>
  <g transform="rotate(12 32 34)">
    <!-- bottom cap -->
    <path d="M17 49v6a15 4.6 0 0 0 30 0v-6Z" fill="url(#ntCap)"/>
    <!-- the glass and what is in it -->
    <rect x="19" y="15" width="26" height="36" fill="url(#ntJuice)"/>
    <path d="M23 24c3 2 6-1 9 1s5 5 9 3M22 34c4-2 6 2 10 0s6-3 9-1M23 43c3 1 6-2 9 0s5 2 8 0" stroke="#cfeaff" stroke-width="1.6" stroke-opacity="0.55"/>
    <circle cx="37" cy="21" r="1.6" fill="#e4f4ff" fill-opacity="0.8"/>
    <circle cx="27" cy="39" r="1.2" fill="#e4f4ff" fill-opacity="0.7"/>
    <circle cx="39" cy="45" r="1.9" fill="#e4f4ff" fill-opacity="0.6"/>
    <rect x="22.4" y="18" width="3" height="30" rx="1.5" fill="#ffffff" fill-opacity="0.5"/>
    <!-- gold bands, top and bottom of the glass -->
    <path d="M18 47v3a14 3.6 0 0 0 28 0v-3a14 3.6 0 0 1-28 0Z" fill="url(#ntGold)"/>
    <path d="M18 15v3a14 3.6 0 0 0 28 0v-3Z" fill="url(#ntGold)"/>
    <!-- the gold rail down the front: on the capsule's axis, from the front
         of the top band to the front of the bottom one -->
    <rect x="29.5" y="20.6" width="5" height="30.8" fill="url(#ntGold)"/>
    <rect x="30.7" y="21.6" width="1.4" height="28.8" rx="0.7" fill="#fff6c8" fill-opacity="0.8"/>
    <!-- top cap -->
    <path d="M17 9v6a15 4.6 0 0 0 30 0V9Z" fill="url(#ntCap)"/>
    <ellipse cx="32" cy="9" rx="15" ry="4.6" fill="url(#ntTop)"/>
    <ellipse cx="32" cy="9.3" rx="9.5" ry="2.6" fill="#7c1a8c"/>
    <ellipse cx="32" cy="9.9" rx="8" ry="1.8" fill="#a52aa8"/>
    <path d="M20.4 12.6v3.6" stroke="#ffd8fa" stroke-width="1.8" stroke-opacity="0.7"/>
    <path d="M20.4 51v3.4" stroke="#ffd8fa" stroke-width="1.8" stroke-opacity="0.6"/>
    <!-- the pin -->
    <rect x="30.6" y="1.6" width="3" height="9" rx="1.3" fill="url(#ntPin)"/>
  </g></svg>